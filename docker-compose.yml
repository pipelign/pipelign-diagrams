x-renderer-environment: &renderer-environment
  PLANTUML_JAR_PATH: /app/plantuml/plantuml.jar
  MERMAID_CMD: /opt/mermaid-cli/bin/mmdc
  MERMAID_PUPPETEER_CONFIG_PATH: /app/mermaid/puppeteer-config.json
  LOG_LEVEL: INFO
  DIAGRAM_API_TOKEN: ${DIAGRAM_API_TOKEN:-}
  DIAGRAM_API_TOKEN_PREVIOUS: ${DIAGRAM_API_TOKEN_PREVIOUS:-}

x-renderer-isolation: &renderer-isolation
  init: true
  read_only: true
  cpus: 1
  mem_limit: 2g
  pids_limit: 256
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,mode=1777"]

services:
  pipelign-diagrams:
    <<: *renderer-isolation
    image: pipelign-diagrams:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pipelign-diagrams
    ports:
      - "127.0.0.1:8080:8080"
    environment: *renderer-environment
    restart: unless-stopped

  pipelign-diagrams-dev:
    <<: *renderer-isolation
    image: pipelign-diagrams:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pipelign-diagrams-dev
    ports:
      - "127.0.0.1:8080:8080"
    environment: *renderer-environment
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload

  pipelign-diagrams-tests:
    <<: *renderer-isolation
    image: pipelign-diagrams-tests:local
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: pipelign-diagrams-tests
    environment: *renderer-environment
    volumes:
      - ./tests:/app/tests:ro
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
